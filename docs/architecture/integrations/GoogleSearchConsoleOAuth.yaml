name: Google Search Console OAuth
type: Integration Trust Boundary
location:
  - config/apiurls.php
  - config/services.php
  - app/Http/Controllers/ProfileConnectorController.php
  - app/Integrations/GoogleSearchConsole/GoogleSearchConsoleAdapter.php
  - app/Models/GoogleSearchConsoleConnection.php
  - app/Services/GoogleSearchConsoleReportService.php
  - database/migrations/2026_08_19_000001_create_google_search_console_connections_table.php
  - resources/js/components/connectors/GoogleSearchConsoleConnectorCard.vue
  - routes/console.php
purpose: Define tenant-scoped, readonly Google Search Console OAuth access for automated search performance retrieval.
when_to_use:
  - Connecting a tenant admin's Google Search Console account
  - Fetching Search Console performance data for a tenant-owned property
  - Showing or revoking Search Console connection status
when_not_to_use:
  - Google Docs or Google Drive document creation
  - Google Analytics measurement or reporting
  - Public marketing page tracking
rules:
  - Search Console OAuth must use the readonly webmasters scope only unless broader scopes receive explicit approval.
  - OAuth authorization requests must ask for offline access so scheduled retrieval can refresh tokens without user presence.
  - OAuth state must be random, session-bound, tenant-bound, and verified before storing tokens.
  - Refresh tokens and access tokens must be encrypted at rest.
  - Stored connection rows are tenant-owned and tenant-scoped.
  - A tenant may have only one current Search Console connection row.
  - Reconnects must upsert the tenant connection instead of creating duplicate current rows.
  - UI payloads must never expose OAuth access tokens, refresh tokens, client secrets, or authorization codes.
  - Search Console performance retrieval must use the server-side adapter, not browser-side Google API calls.
  - Search Console API endpoint URLs belong in config/apiurls.php, while credentials belong in config/services.php.
  - OAuth authorization must route through Google's account chooser before consent so the browser's active Google profile is not silently reused.
  - The OAuth redirect URI must be configurable; local development must use a Google-approved localhost callback instead of .test domains.
  - Search Console markdown reports must be generated server-side for the configured FooMake property and must not expose OAuth tokens.
public_interface:
  - profile.connectors.google-search-console.connect
  - profile.connectors.google-search-console.callback
  - profile.connectors.google-search-console.destroy
  - profile.connectors.google-search-console.performance
  - profile.connectors.google-search-console.report
  - GoogleSearchConsoleAdapter::authorizationUrl()
  - GoogleSearchConsoleAdapter::exchangeCode()
  - GoogleSearchConsoleAdapter::sites()
  - GoogleSearchConsoleAdapter::searchAnalytics()
  - GoogleSearchConsoleReportService::markdown()
  - GoogleSearchConsoleConnection
  - search-console:report
example_usage: |
  Controller:
    return redirect()->away($client->authorizationUrl($state, route('profile.connectors.google-search-console.callback')));

  Adapter:
    $rows = $client->searchAnalytics($connection, now()->subDays(28), now()->subDay(), ['query'], 10);

  Command:
    php artisan search-console:report

  Browser download:
    GET /profile/connectors/google-search-console/report
