name: Purchase Order Receipt Inventory Impact
type: Domain Rule
location:
  - app/Services/Purchasing/PurchaseOrderLifecycleService.php
  - app/Models/PurchaseOrderReceiptLine.php
  - app/Models/StockMove.php
  - database/migrations/2026_04_30_000001_add_stock_move_id_to_purchase_order_receipt_lines_table.php
purpose: Ensure purchase order receipt lines are always recorded while only stockable receipt lines post linked stock moves in item base units.
when_to_use:
  - Receiving purchase orders into inventory
  - Auditing inventory impact for purchase receipts
when_not_to_use:
  - Short-closing purchase orders
  - Manual inventory adjustments outside purchase receiving
rules:
  - Every purchase order receipt line must be recorded even when the received item is non-stockable.
  - Purchase order receiving is submitted as one PO-level receipt event with one or more positive receipt lines.
  - Zero and blank submitted receipt quantities are ignored before receipt persistence.
  - At least one positive receipt quantity is required for each receipt event.
  - Stock moves are created only for receipt lines whose item has items.is_stockable = true.
  - Stockable receipt lines link to their stock move through stock_move_id.
  - Non-stockable receipt lines keep stock_move_id null.
  - Receipt stock move quantity is calculated as received_quantity multiplied by item_purchase_options.pack_quantity, then converted from package UoM into the item base UoM when those UoMs differ.
  - Receipt conversion precedence is item-specific conversion, then tenant/general conversion, then global conversion.
  - Receipt conversion may use direct, reciprocal, or multi-step paths through defined conversion records.
  - Receipt conversion and quantity math use BCMath string math at scale 6; receipt creation fails transactionally when a required conversion is unavailable.
  - Receipt stock moves must remain the source of truth for inventory on-hand.
  - Receipt creation must fail transactionally if stock move creation fails.
  - Stockable Material detail net-quantity stats treat purchase orders with status CREATED or PARTIALLY_RECEIVED as open supply and add the remaining unreceived quantity converted from supplier package UoM into item base UoM.
public_interface:
  - PurchaseOrderLifecycleService::createReceipt()
  - PurchaseOrderReceiptLine::stockMove()
  - Item::onHandQuantity()
example_usage: |
  $baseQuantity = bcmul('2.000000', '500.000000', 6);
  // $baseQuantity === '1000.000000'
