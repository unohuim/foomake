name: Purchase Order Lifecycle
type: Domain Rule
location:
  - app/Models/PurchaseOrder.php
  - app/Http/Controllers/PurchaseOrderStatusController.php
  - app/Http/Controllers/PurchaseOrderWorkflowController.php
  - app/Services/Purchasing/PurchaseOrderLifecycleService.php
  - app/Services/Workflows/PurchaseOrderWorkflow.php
purpose: Keep purchase order lifecycle explicit while Purchase Orders adopt shared workflow state before the legacy status column is removed.
when_to_use:
  - Changing purchase order status
  - Completing Purchase Order workflow stages
  - Receiving, back-ordering, cancelling, or short-closing purchase orders
when_not_to_use:
  - Sales order lifecycle changes
  - Manual inventory adjustments outside purchase receiving
rules:
  - purchase_orders.status persists only DRAFT, CREATED, PARTIALLY_RECEIVED, RECEIVED, COMPLETED, or CANCELLED.
  - New purchase orders start in DRAFT.
  - New purchase orders enter the first active purchasing workflow stage when workflow stages exist.
  - PO detail display status derives from workflow state, except receipt-derived PARTIALLY_RECEIVED is displayed while the PO remains in the normal Receiving stage.
  - Valid status progression is DRAFT to CREATED, CREATED to PARTIALLY_RECEIVED through receipt events, PARTIALLY_RECEIVED to RECEIVED when all receivable balances are closed, and RECEIVED to COMPLETED.
  - Every purchasing workflow stage status_complete_label must come from the workflow status option provider; persisted purchase order statuses include PARTIALLY_RECEIVED, and the workflow-stage dropdown may also expose OPEN for workflow-derived stage configuration.
  - Default purchasing workflow stages must not create a duplicate PARTIALLY_RECEIVED receiving stage; partial receipt status is set by receipt logic while the PO remains in the normal Receiving stage.
  - Receipt events that leave any receivable balance open persist PARTIALLY_RECEIVED.
  - Additional partial receipt events keep PARTIALLY_RECEIVED until all receivable balances are received or short-closed.
  - Workflow stage completion mirrors legacy status only for migration compatibility.
  - The purchasing inventory-effect stage cannot be completed directly by the generic workflow-complete endpoint.
  - Created to Received requires the Receive slide-over; receipt submit records receipt details and then advances workflow fields when balances are closed.
  - Cancel transitions eligible purchase orders to persisted terminal status CANCELLED.
  - Cancel sets workflow_cancelled_at and blocks future workflow actions.
  - cancelled_at and cancelled_by_user_id are audit metadata and are not display authority.
  - Back Order is a receiving-stage marker/event and must not persist as a status value.
  - Short Close is stored through short-close history and quantities, not as a status value.
  - Purchase orders may carry one nullable workflow assignee in purchase_orders.assigned_to_user_id.
  - Purchase order assignee options must be tenant-scoped and limited to users eligible for purchasing workflow work.
  - Line-level tax is entered with one decimal place, stored in basis points on purchase_order_lines, and PO tax totals are calculated per line.
  - Draft PO line pack_count stores whole package counts only.
  - Purchase order detail workflow actions must use the shared workflow-action-button contract and shared loading overlay while a server mutation is pending.
  - Purchase order action labels must come from the seeded workflow stage contract, with the closed label derived from the current stage and the dropdown action label derived from the next stage.
  - Purchase order workflow actions must hydrate the page in place after success instead of forcing a browser reload.
  - Purchase order details, shipping, line add/remove, and line quantity/tax edits remain editable until cancellation, workflow completion, or completion of the configured purchasing inventory-effect stage.
  - Backend gates and transition rules are authoritative; UI visibility is not authorization.
public_interface:
  - PurchaseOrder::statuses()
  - PurchaseOrderStatusController::update()
  - PurchaseOrderWorkflowController::complete()
  - PurchaseOrderWorkflowController::cancel()
  - PurchaseOrderLifecycleService::createReceipt()
  - PurchaseOrderLifecycleService::createShortClosure()
  - PurchaseOrderWorkflow::completeStage()
  - PurchaseOrderWorkflow::cancel()
  - PurchaseOrderWorkflow::responsePayload()
example_usage: |
  $order->forceFill(['status' => PurchaseOrder::STATUS_CREATED])->save();
