name: Workflow Progress Panel
type: UI Component
location:
  - app/Actions/Workflows/BuildWorkflowProgressStepsAction.php
  - resources/views/components/ui/workflow-progress.blade.php
purpose: Render read-only workflow progress for workflow-enabled resource detail pages from tenant-configured workflow stages, with optional DRAFT display.
when_to_use:
  - Showing passive workflow position on workflow-enabled resource detail pages
  - Rendering Sales Order, Purchase Order, Make Order, or Inventory Count progress below the resource header
when_not_to_use:
  - Workflow stage transitions
  - Workflow stage administration
  - Task completion controls
  - Breadcrumbs or primary navigation
rules:
  - The component accepts a boolean do_draft prop that defaults to false.
  - When do_draft is true, the first visual step is DRAFT.
  - When do_draft is false, DRAFT is omitted and active tenant-configured workflow stage names render in workflow stage sort order.
  - DRAFT is current when the resource has not entered an operational workflow stage and do_draft is true.
  - DRAFT is completed when the resource has an active current workflow stage and do_draft is true.
  - Stages before the current stage render completed.
  - The matching current stage renders aria-current="step".
  - Stages after the current stage render upcoming.
  - Completed workflows must render with no current step.
  - Completed workflows must mark every stage through the completed stage as completed, including DRAFT only when do_draft is true.
  - If a completed workflow does not provide a completed stage id, all configured active stages render completed.
  - Mobile rendering uses a horizontal read-only stage selector: all stage numbers remain visible, completed stages use the same filled-indigo visual language as desktop, and selecting a number only reveals that stage label without submitting workflow changes.
  - Workflow progress is read-only and must not expose transition actions, task completion controls, drag and drop, or stage configuration.
  - Existing resource page authorization remains authoritative; the progress panel must not grant access to any page or data.
  - The panel must use Blade and Tailwind utilities only.
  - The panel must not introduce Vue, Tailwind Plus scripts, external UI packages, inline styles, CSS files, or global JavaScript state.
public_interface:
  - BuildWorkflowProgressStepsAction::execute()
  - <x-ui.workflow-progress :steps="$workflowProgressSteps" :do_draft="true" />
example_usage: |
  $workflowProgressSteps = app(BuildWorkflowProgressStepsAction::class)->execute(
      tenantId: $tenantId,
      domainKey: 'inventory',
      currentWorkflowStageId: $inventoryCount->workflow_stage_id,
      completedWorkflowStageId: $inventoryCount->workflow_stage_id,
      workflowCompleted: $inventoryCount->posted_at !== null,
  );

  <x-ui.workflow-progress :steps="$workflowProgressSteps" :do_draft="true" />
