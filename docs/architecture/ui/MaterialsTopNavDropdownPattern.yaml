name: Process Top Nav Dropdown Pattern
type: UI Pattern
location:
  - resources/views/layouts/navigation.blade.php
purpose: Group process-owned operational primitives under their appropriate top navigation dropdown.
when_to_use:
  - A process domain owns mandatory supporting subdomains and operational primitives
when_not_to_use:
  - Unrelated or optional domains
rules:
  - The dropdown appears in the top horizontal navigation.
  - Active state is subtle and consistent with the navigation style.
  - Manufacturing owns Make Orders and Recipes.
  - Stock owns Inventory, Inventory Counts, Materials, and unit-of-measure administration.
public_interface:
  - Blade markup and Alpine interaction in the navigation layout
example_usage: |
  <x-dropdown>
      <x-slot name="trigger">Stock</x-slot>
      <x-slot name="content">
          <x-dropdown-link href="/inventory">Inventory</x-dropdown-link>
          <x-dropdown-link href="/materials">Materials</x-dropdown-link>
      </x-slot>
  </x-dropdown>
