name: Slide-Over Form Pattern
type: UI Pattern
location:
  - resources/views/components/slide-over-shell.blade.php
purpose: Create or edit entities without leaving the current page.
when_to_use:
  - CRUD forms with multiple fields
  - Actions that should not navigate away from list pages
when_not_to_use:
  - Confirmations or single-field actions
rules:
  - Alpine directives use single-quoted JavaScript strings.
  - HTML attributes use double quotes.
  - Create and edit Blade drawers must use the shared slide-over shell component for backdrop, panel, header, close button, form frame, and footer frame.
  - Resource-specific Blade may provide body fields, validation messages, footer actions, and existing page-scoped Alpine handlers.
  - Confirmation modals and JavaScript-owned shared import/export drawers are separate patterns and must not be forced through this Blade component.
public_interface:
  - <x-slide-over-shell open="..." close="..." submit="..." title="..." title-id="...">
  - Named footer slot for resource-specific actions
example_usage: |
  <x-slide-over-shell
      open="isCreateOpen"
      close="closeCreate()"
      submit="submitCreate()"
      title="Create Material"
      title-id="create-material-slide-over-title"
  >
      <input type="text" x-model="form.name" />
      <x-slot name="footer">
          <button type="submit">Save</button>
      </x-slot>
  </x-slide-over-shell>
