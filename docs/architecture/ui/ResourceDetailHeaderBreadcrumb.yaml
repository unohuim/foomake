name: Resource Detail Header Breadcrumb
type: UI Layout Pattern
location:
  - resources/views/components/resource-detail-header-breadcrumb.blade.php
  - resources/views/materials/show.blade.php
  - resources/views/manufacturing/recipes/show.blade.php
  - resources/views/manufacturing/make-orders/show.blade.php
purpose: Standardize resource detail headers so the title body and breadcrumb share one aligned container contract, with the breadcrumb rendered at the bottom of the header.
when_to_use:
  - Building or updating any resource detail page
  - Rendering a resource title with bottom-aligned breadcrumbs
when_not_to_use:
  - Index pages without a detail header
  - Standalone navigation bars unrelated to a resource detail view
rules:
  - Resource detail pages must use one shared header and breadcrumb component or match its exact contract.
  - The breadcrumb must sit at the bottom of the resource detail header.
  - The breadcrumb container and title container must share the same max-width and horizontal padding contract.
  - The breadcrumb home icon left edge must align horizontally with the resource title left edge.
  - Connected chevron or arrow separators with visible horizontal border lines are part of the shared breadcrumb contract.
  - Header metadata must render through the shared component metadata slot rather than page-local breadcrumb wrappers.
  - The shared component must support grouped metadata rows for compact resource headers.
  - Workflow-enabled resources may render a shared header action slot for next-stage actions when a valid configured workflow transition exists.
  - Workflow-enabled resources may render a shared header action slot for workflow entry when a pre-workflow draft state can move into the first configured workflow stage.
  - Header workflow action buttons are only UI entry points into the existing workflow-stage transition system and must not hardcode lifecycle status transitions.
  - When a resource header displays a workflow-stage chip, the label must come from the resource's configured workflow-stage payload rather than a lifecycle status fallback.
  - Workflow-enabled headers may display a pre-workflow state such as `DRAFT`, but all post-entry labels and button text must come from configured workflow-stage payload data.
  - Header meta chips, icon chips, and optional actions must render inside the shared header component instead of page-local breadcrumb wrappers.
  - Materials, Recipes, and Make Orders must conform to this shared contract.
  - Inventory Counts must use the same shared header contract even when preserving their existing visual button treatment.
  - Resource breadcrumbs should use the Home / resource / record label pattern when a detail record label is available.
  - Make Order detail titles should use the `Make Order {id}` convention.
  - Header metadata chips should stay compact and avoid duplicative label noise.
public_interface:
  - resources/views/components/resource-detail-header-breadcrumb.blade.php
  - resources/views/components/resource-breadcrumbs.blade.php
example_usage: |
  <x-resource-detail-header-breadcrumb :items="$breadcrumbItems" :title="$makeOrder->title">
      <x-slot name="metadata">
          <div class="flex flex-wrap items-center gap-x-3 gap-y-2" data-resource-detail-header-metadata-group="primary">
              <span>{{ $makeOrder->recipe_name }}</span>
              <span>{{ __('Runs') }} {{ $makeOrder->runs_text }}</span>
          </div>
          <div class="flex flex-wrap items-center gap-x-3 gap-y-2" data-resource-detail-header-metadata-group="secondary">
              <span>{{ $makeOrder->output_item_name }}</span>
              <span>{{ __('Expected Output') }} {{ $makeOrder->produced_quantity_text }}</span>
          </div>
      </x-slot>
      <x-slot name="actions">
          <button type="button">{{ $workflow['next_stage_action']['label'] }}</button>
      </x-slot>
  </x-resource-detail-header-breadcrumb>
