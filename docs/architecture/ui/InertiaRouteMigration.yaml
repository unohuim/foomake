example_usage: |
  Controller:
    return Inertia::render('Home', [
        'hero' => [
            'headline' => 'Keep the day’s batches moving without another clipboard.',
        ],
        'auth' => [
            'loginUrl' => route('login', absolute: false),
            'registerUrl' => route('register', absolute: false),
        ],
    ]);

  Page:
    <GuestShell @open-auth="openAuth">
        <HeroSection :hero="hero" @primary-action="openAuth('register')" />
        <AuthDrawer :open="authOpen" :mode="authMode" @close="closeAuth" />
    </GuestShell>
