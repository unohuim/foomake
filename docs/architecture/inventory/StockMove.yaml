name: StockMove
type: Eloquent Model / Domain Rule
location:
  - app/Models/StockMove.php
purpose: Represent append-only inventory movements that form the inventory ledger.
when_to_use:
  - Any inventory-affecting operation such as receipts, issues, or adjustments
when_not_to_use:
  - Storing or mutating on-hand totals directly
rules:
  - Stock moves are append-only and must not be updated or deleted.
  - Stock moves are created only for items where items.is_stockable = true.
  - Quantity is signed and recorded in the item base UoM.
  - Stockability must suppress move creation without blocking the surrounding business workflow.
  - Purchase receipt stock moves are created one-to-one from purchase_order_receipt_lines for stockable receipt lines and linked back to the receipt line.
  - Starting inventory created during material setup must post through stock_moves only when the material is stockable, even when a visible `Initial Stock` inventory count record is also created.
  - Material detail On Hand stats are read from the stock move ledger and must not come from a denormalized items-table quantity column.
  - Enum-like values must use values defined in docs/ENUMS.md.
public_interface:
  - Item::stockMoves()
  - Item::onHandQuantity()
example_usage: |
  StockMove::create([
      'tenant_id' => $tenant->id,
      'item_id' => $item->id,
      'uom_id' => $item->base_uom_id,
      'quantity' => '10.000000',
      'type' => 'receipt',
  ]);
