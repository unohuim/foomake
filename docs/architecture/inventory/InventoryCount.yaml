name: InventoryCount
type: Eloquent Model
location:
  - app/Models/InventoryCount.php
purpose: Represent an inventory count session whose posted lifecycle remains derived from posted_at while operational progression uses tenant-configured Inventory workflow stages.
when_to_use:
  - Recording inventory count sessions
  - Posting inventory count adjustments to the ledger
  - Tracking inventory count progression through the Inventory workflow domain after draft setup
when_not_to_use:
  - Storing inventory adjustments without an inventory count context
rules:
  - Draft remains outside workflow stages and is represented by workflow_stage_id = null while posted_at is null.
  - Status is computed from posted_at and not stored in the database.
  - Count creation records created_by_user_id and tasked_by_user_id audit fields on the inventory count.
  - Assignment is optional during draft setup; when present it is reused for generated workflow tasks.
  - Actual workflow assignment uses generated tasks assigned through tasks.assigned_to_user_id.
  - Submitted counts enter the first active Inventory workflow stage for the tenant and automatically complete automatic stages until a manual stage is reached.
  - Moving past the seeded Scheduling stage requires at least one attached Inventory Count material line.
  - With seeded Inventory stages, pressing Schedule enters automatic Scheduling, completes it, and lands in manual Counting with visible status SCHEDULED.
  - Submitting a count generates workflow tasks only for the manual Inventory stage that remains current after automatic stages complete.
  - Leaving the current Inventory workflow stage is blocked while required current-stage tasks remain open.
  - Inventory count detail uses the shared resource-detail header plus reusable detail-section pattern with a Details section, a Materials section, and a Tasks section.
  - Inventory Count detail headers should not use rounded metadata pills for counted date, line count, workflow stage, or notes; the header should show the counted date with a clean workflow-derived status badge underneath and move editable metadata into the Details section.
  - Inventory Count detail workflow-status badges must not render the computed posted lifecycle value; `posted` is a storage lifecycle marker and must not appear as a workflow-stage status.
  - Inventory Count detail workflow-status badges should render Draft before the first Inventory workflow stage is completed, the previous completed stage's `status_complete_label` while sitting in a later non-posted stage, and the current inventory-effect stage's `status_complete_label` after posting.
  - Posted Inventory Count workflow progress should mark the inventory-effect stage complete and render no current workflow step.
  - The Inventory Count `Details` section keeps Count Date, Assigned To, and Notes together in one compact responsive layout consistent with other detail-edit sections.
  - Inventory Count `Details` updates use the existing inventory count update route through AJAX/autosave and may remain editable after submission until the count reaches a posted or inventory-effect stage.
  - Empty Inventory Count detail Notes should render as blank editable content and should not show placeholder dashes.
  - The Materials section manages inventory count lines through reusable list/create/update/delete endpoints.
  - Draft Inventory Count Materials sections should use the shared compact add-row contract with a combobox on the left and a `+` button on the right to add an existing tenant-scoped material line.
  - The draft Materials `+` action adds the selected existing material line to the count and must not open a new Material or Item create slide-over.
  - Draft Inventory Count Materials rows should disable the vertical-dots row menu and use one direct AJAX-first inline `x-mark` remove action instead.
  - The draft-only remove action must stay compact, bordered, rounded, and right-aligned with the row content.
  - Draft Inventory Count Materials rows do not render a Qty label or Qty input.
  - Inventory Count material lines may be added only while the count remains in Draft.
  - Inventory Count material lines may be removed only while the count remains in Draft.
  - Entering any workflow stage hides the Materials remove action and server-side line removal must be rejected even if add/edit remains available.
  - Once the count enters a non-posted workflow stage, Materials rows should switch into Qty-editing mode and expose a right-aligned AJAX-first counted-quantity input instead of the remove action.
  - Workflow-stage Materials rows should label that input as `QTY`, not `Qty`, and the row must never show the Draft remove control at the same time.
  - Draft Materials rows and workflow-stage Materials rows are mutually exclusive UI modes; a row must never show both the remove action and the Qty input together.
  - Entering any workflow stage hides the Materials combobox add row and server-side line creation must be rejected.
  - Successful draft line removal should return `deleted_line_id` plus the remaining line payload so the shared section can remove the row immediately without a full page refresh.
  - Successful draft line creation should return the created line payload plus refreshed shared section config so the add combobox options stay synchronized with duplicate-line exclusion.
  - Workflow-stage counted-quantity edits should persist through the existing line update route, normalize to canonical scale 6, and return the refreshed line payload for immediate row updates without a full page refresh.
  - Workflow-stage counted-quantity input values should display using the counted item's base UoM display precision rather than raw canonical scale-6 values.
  - Workflow-stage counted-quantity update responses should include both canonical stored quantity and UoM-formatted display/input strings.
  - Successful workflow-stage counted-quantity AJAX saves should show a transient row-scoped green check-circle confirmation just before the `QTY` label and should not show that indicator on failed saves.
  - Draft counts must reject Qty-only line updates server-side.
  - Duplicate item_id values are rejected within the same inventory count and should be excluded from the Draft Materials combobox options where feasible.
  - Inventory Count Materials row notes should render only when present and should not show dash placeholders for blank notes.
  - Stockable Material detail may mount an Inventory Counts shared CRUD detail section that reuses the same Inventory Count create slide-over contract as the Inventory Counts index page.
  - When Material detail exposes that create shortcut, the shared Inventory Count slide-over must be rendered inside a live page-level Alpine component dedicated to the create form, mounted in the resource-detail overlay area so it stays inside the active page scope and outside clipping containers.
  - The Material detail Inventory Counts `+` action should call a mounted open handler that toggles the exact `showCountForm` state bound by that rendered shared slide-over.
  - The Material detail Inventory Counts section `createAction` contract must include a concrete handler config object with `handlerKey = openInventoryCountCreate`, and the shared CRUD section must pass that action object to the page-level create handler.
  - Material-detail Inventory Count create remains scoped to the current material and redirects to the created count detail page.
  - Successful empty loads for the Material-detail Inventory Counts section must render only the configured empty state and must not surface a load-failure message.
  - The Tasks section is workflow-driven and exposes current-stage workflow tasks using the existing task completion route and payload pattern.
  - The Tasks section renders a visible inline Complete button only for incomplete completable tasks and disables the shared vertical-dots row menu through reusable section config.
  - Completed task rows do not render a Complete action.
  - Inventory Count task-row metadata always shows Assigned By from the Inventory Count creator/assigner source.
  - Incomplete task rows show Assigned To and do not show Completed By.
  - Completed task rows show Completed By and do not show Assigned To.
  - Assigned To and Completed By must never render together.
  - Missing Completed By values must not render a dash or placeholder.
  - Inventory Count task-row Complete actions remain right-aligned and vertically centered inside the shared section renderer.
  - Task completion uses PATCH /tasks/{task}/complete.
  - The Inventory Count create counted_at field blurs the native picker after a real value change and may move focus to the next logical field without clearing the selected datetime value.
  - Duplicate item_id values are rejected within the same inventory count, while the same material may appear on different inventory counts.
  - Count lines may omit counted_quantity during draft/setup and non-effect workflow stages.
  - Every count line must have counted_quantity before posting or completing the inventory-effect stage.
  - Posting inventory counts creates stock moves only for stockable items on the count.
  - Non-stockable count lines remain valid workflow records but do not generate stock moves when posted.
  - Advancing into a manual Inventory inventory-effect stage does not post the count.
  - Completing the current Inventory inventory-effect stage posts the count through PostInventoryCountAction.
  - Posting must remain transactional and idempotent through posted_at guarding.
  - The direct /post compatibility path may move a count directly to the inventory-effect stage before posting.
  - Posting sets posted_at and posted_by_user_id.
  - Draft detail pages expose only the next valid workflow action, defaulting to SCHEDULE when seeded stages are unchanged.
  - Submitted non-terminal counts may expose both previous-stage and next-stage actions using stage names only.
  - A current non-posted inventory-effect stage exposes a terminal `Complete` action even when the configured stage action verb was used to enter that stage.
  - Previous-stage actions are Inventory Count specific, are hidden on Draft/first-stage/posted states, and never reverse stock moves.
  - Inventory Count previous and next buttons must be resolved from configured stage order, not hardcoded stage keys.
  - Visible Post Count actions are hidden from the UI while the backend /post route remains compatible.
  - Positive starting quantity for a stockable material creates an `Initial Stock` inventory count that is immediately completed/posted through the existing inventory-count posting behavior.
  - Non-stockable materials must reject starting quantity input because they do not track inventory.
  - Inventory count detail breadcrumbs render Home / Inventory Counts / ID# {id}.
  - Inventory Count detail header workflow actions remain separate from the Details section and continue to use the shared header action slot.
  - Draft Inventory Count detail headers must expose the next workflow-stage action button when the user can execute inventory adjustments and a valid next stage exists.
  - Inventory count index exposes Counter as the assigned-user email and truncates that value to 20 characters in mobile list summaries.
  - Inventory count index Status shows the current workflow stage `name` rather than the posted lifecycle label.
  - Enum-like values must use values defined in docs/ENUMS.md.
public_interface:
  - lines()
  - workflowStage()
  - createdByUser()
  - taskedByUser()
  - assignedToUser()
  - stockMoves()
  - getStatusAttribute()
  - docs/architecture/workflows/WorkflowStageTaskGating.yaml
example_usage: |
  $status = $inventoryCount->status;
