name: Derived Workflow Status
type: Workflow Status Rule
location:
  - app/Http/Controllers/InventoryCountController.php
  - app/Models/PurchaseOrder.php
  - app/Services/Workflows/PurchaseOrderWorkflow.php
  - database/migrations/2026_05_28_000003_add_workflow_foundation_fields.php
purpose: Define how workflow-enabled records derive visible status from workflow state while legacy domain status columns remain during migration.
when_to_use:
  - Rendering workflow-enabled record status in detail headers
  - Building workflow action-button JSON
  - Migrating domain-owned lifecycle status columns toward workflow-derived status
when_not_to_use:
  - Persisting arbitrary custom status strings on domain records
  - Deriving non-workflow audit markers such as Back Order or Short Close
rules:
  - If `workflow_cancelled_at` is not null, the derived status is `CANCELLED`.
  - If `last_completed_workflow_stage_id` is null, the derived status is `DRAFT`.
  - Purchase Orders with receipt-derived `PARTIALLY_RECEIVED` display that status while remaining in the normal Receiving stage.
  - Otherwise the derived status is `last_completed_workflow_stage.status_complete_label`.
  - Make Orders render visible workflow labels from the configured manufacturing workflow stage payload while `make_orders.status` remains a legacy compatibility field.
  - Inventory Counts do not yet store `last_completed_workflow_stage_id`; their detail header infers derived status from active Inventory stage order and must never render the computed posted lifecycle value as a workflow status.
  - Posted Inventory Counts render the current inventory-effect stage's `status_complete_label`, not `Posted`.
  - Legacy domain status columns may be mirrored during migration but must not be the PO detail action-button display authority, except for receipt-derived `PARTIALLY_RECEIVED` because it has no duplicate seeded workflow stage.
  - Workflow cancellation is terminal and blocks future workflow actions.
public_interface:
  - PurchaseOrder::workflowStatus()
  - MakeOrderController::makeOrderWorkflowPayload()
  - PurchaseOrderWorkflow::responsePayload()
example_usage: |
  Purchase Order workflow display:
    current_workflow_stage = Receiving
    last_completed_workflow_stage = Creating
    derived_status = CREATED, or PARTIALLY_RECEIVED after a partial receipt event
