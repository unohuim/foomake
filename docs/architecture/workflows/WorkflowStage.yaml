name: Workflow Stage
type: Tenant-Scoped Domain Rule
location:
  - app/Actions/Workflows/EnforceWorkflowStageInventoryEffectInvariantAction.php
  - app/Actions/Workflows/ResolveSalesWorkflowStageAction.php
  - app/Actions/Workflows/SeedDefaultWorkflowStagesForTenantAction.php
  - app/Models/WorkflowStage.php
  - database/migrations/2026_05_07_000002_create_workflow_stages_table.php
  - database/migrations/2026_05_20_000001_add_is_inventory_effect_stage_to_workflow_stages_table.php
  - database/seeders/WorkflowStageSeeder.php
  - docs/PR3_ROADMAP.md
purpose: Define the tenant-scoped operational stage layer that sits inside a workflow domain and drives task generation and lifecycle gating.
when_to_use:
  - Configurable operational middle stages for a tenant/domain
  - Stage ordering, activation, and admin CRUD behavior
  - Stage-scoped task-template generation
when_not_to_use:
  - System lifecycle statuses that remain hard rules
  - Branching workflow engines or conditional orchestration
rules:
  - Workflow stages are tenant-owned and tenant-scoped.
  - Workflow stages belong to exactly one workflow domain.
  - Workflow stages are database-backed rather than hardcoded.
  - Workflow stages represent tenant-configurable operational stages within a workflow domain.
  - A stage key must be unique within its tenant and workflow domain.
  - Stage keys are system-generated from the stage name when a stage is created.
  - Generated stage-key uniqueness must be validated before insert, using the normal Laravel validation error shape.
  - Stage keys are not user-entered in the workflow admin UI.
  - Renaming a stage preserves its existing generated key.
  - The same stage key may exist in different workflow domains.
  - Stages support active and inactive state.
  - Stages support a stage-level is_inventory_effect_stage marker when a domain adopts inventory-effect stage configuration.
  - Admin users may create, edit, deactivate, and reactivate operational stages within the tenant/domain scope.
  - sort_order must persist the exact numeric value entered by the admin UI.
  - Active stage lists must re-sort by sort_order immediately after stage saves without requiring a page refresh.
  - The workflow admin UI does not expose a manual reorder button for stages.
  - Default sales workflow stages are seeded idempotently per tenant as packing, packed, and shipping, with packed marked as the default inventory-effect stage.
  - Default purchasing workflow stages are seeded idempotently per tenant as receiving and completed, with receiving marked as the default inventory-effect stage.
  - Default manufacturing workflow stages are seeded idempotently per tenant as production and completed, with production marked as the default inventory-effect stage.
  - Default inventory workflow stages are seeded idempotently per tenant as open and completed, with completed marked as the default inventory-effect stage.
  - Sales-order runtime ordering must use the active sales workflow stages ordered by sort_order.
  - Sales-order statuses that remain system-owned are documented in docs/PR3_ROADMAP.md and docs/ENUMS.md rather than duplicated here.
public_interface:
  - EnforceWorkflowStageInventoryEffectInvariantAction::normalizeAndAssert()
  - ResolveSalesWorkflowStageAction::activeStages()
  - ResolveSalesWorkflowStageAction::firstActiveStage()
  - ResolveSalesWorkflowStageAction::nextActiveStage()
  - SeedDefaultWorkflowStagesForTenantAction::execute()
  - WorkflowStageInventoryEffectInvariant.yaml
  - docs/architecture/workflows/WorkflowDomain.yaml
  - docs/architecture/workflows/WorkflowTaskTemplate.yaml
  - workflow-manage
example_usage: |
  Sales stage configuration:
    tenant = current tenant
    domain = sales
    stage = packing
    is_active = true
    is_inventory_effect_stage = false
    sort_order = 10
